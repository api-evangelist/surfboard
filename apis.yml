name: Surfboard
description: >-
  Surfboard (teamsurfboard.com) was a workforce management (WFM) SaaS for customer support
  teams — scheduling, forecasting, and real-time staffing for contact centers — backed by
  Seedcamp and Speedinvest. As of this enrichment pass the standalone product no longer operates
  independently; teamsurfboard.com returns an HTTP 301 permanent redirect to Dialpad's workforce
  management software page (dialpad.com/features/workforce-management-software), indicating Surfboard
  was acquired by / folded into Dialpad. No standalone Surfboard developer portal, API reference,
  or OpenAPI surface is publicly reachable; all probed /.well-known/ discovery endpoints return 404.
